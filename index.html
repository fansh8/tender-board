<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>京津冀医院招标看板</title>
<style>
:root{
  --blue:#007aff; --blue-2:#0a84ff; --blue-soft:rgba(0,122,255,.10);
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#8e8e93;
  --line:rgba(60,60,67,.12); --red:#ff3b30; --amber:#ff9500; --green:#34c759;
  --shadow:0 1px 3px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --blue:#0a84ff; --blue-2:#409cff; --blue-soft:rgba(10,132,255,.22);
    --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --muted:#8e8e93;
    --line:rgba(84,84,88,.65); --red:#ff453a; --amber:#ff9f0a; --green:#30d158;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}

/* 顶栏 */
.topbar{background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);color:var(--text);padding:14px 20px;position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line)}
.topbar-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:19px;flex:none}
.brand h1{font-size:20px;margin:0;letter-spacing:.5px;white-space:nowrap}
.brand .sub{font-size:12px;opacity:.78;margin-top:1px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;opacity:.92}
.top-right .upd{white-space:nowrap}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px}
.btn-ghost:hover{background:var(--blue-soft)}
.menu-btn{display:none;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px}

/* 布局 */
.layout{max-width:1400px;margin:0 auto;padding:18px 20px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}
aside{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.side-card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.side-head{padding:12px 14px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fbfcfe}
.side-head small{font-weight:400;color:var(--muted)}
.side-body{padding:8px 10px 12px}
details.city{border-radius:8px}
details.city>summary{list-style:none;cursor:pointer;padding:7px 8px;border-radius:8px;display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#2a374a}
details.city>summary::-webkit-details-marker{display:none}
details.city>summary:hover{background:#f4f7fb}
details.city[open]>summary{color:var(--blue)}
.h-list{padding:0 0 4px 8px}
.h-item{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;border-radius:6px;font-size:12.5px;color:#425066;cursor:pointer;border:1px solid transparent}
.h-item:hover{background:var(--blue-soft)}
.h-item.active{background:var(--blue-soft);border-color:#c9dcf3;color:var(--blue);font-weight:600}
.h-item .n{color:var(--muted);flex:none}
.clear-filter{margin:2px 8px 10px;font-size:12px;color:var(--blue);background:none;border:none;padding:0;text-decoration:underline}
.src-list{padding:4px 12px 12px;font-size:12.5px}
.src-list a{display:block;padding:6px 0;color:#33415a;border-bottom:1px dashed #edf0f5}
.src-list a:last-child{border-bottom:none}
.src-list a:hover{color:var(--blue)}
.src-list span{color:var(--muted);font-size:11px;margin-left:4px}

/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.stat.s2:before{background:var(--green)} .stat.s3:before{background:var(--amber)} .stat.s4:before{background:var(--red)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}

/* 重点关注 */
.focus{background:#fff7f6;border:1px solid #f3d2cf;border-left:5px solid var(--red);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:none}
.focus.on{display:block}
.focus h3{margin:0 0 6px;font-size:13px;color:#a83232;display:flex;align-items:center;gap:6px}
.focus ul{margin:0;padding-left:18px}
.focus li{font-size:13px;margin:4px 0;color:#4a2b2b}
.focus li a{color:#8f2f2f;font-weight:600}
.focus li a:hover{text-decoration:underline}
.focus .more{font-size:12px;color:#a83232;margin-left:6px}

/* 筛选 */
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row+.row{margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:13px;color:#425066}
.tab:hover{border-color:#b9cde6}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.spacer{flex:1}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 32px;font-size:13px;outline:none;background:#fbfcfe}
.search input:focus{border-color:#8fb4dd;background:#fff}
.search:before{content:"⌕";position:absolute;left:10px;top:6px;color:var(--muted);font-size:16px}
select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;color:#33415a;outline:none}
.fav-toggle{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;color:#425066}
.fav-toggle.active{background:#fff3cd;border-color:#e6c66a;color:#8a6100;font-weight:600}

/* 品类 chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;color:#3c4b61}
.chip:hover{border-color:#a9c4e5}
.chip.active{background:var(--blue-soft);border-color:#9dc0e8;color:var(--blue);font-weight:600}
.chip .c{color:var(--muted);margin-left:4px;font-size:11px}
.chip.active .c{color:var(--blue)}

/* 列表 */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:14px;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:#c7d8ec;box-shadow:0 4px 18px rgba(16,36,64,.09)}
.card-main{flex:1;min-width:0}
.card-top{display:flex;align-items:flex-start;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--green)}
.dot.closed{background:#9aa6b6}
.card-title{font-size:15px;font-weight:600;color:#16253a;line-height:1.5;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-title:hover{color:var(--blue);text-decoration:underline}
.star{margin-left:auto;border:none;background:none;font-size:18px;color:#c8d1de;flex:none;line-height:1;padding:0 2px}
.star.on{color:#e0a91b}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:7px}
.org{color:#3b4a60;font-weight:500}
.pill{background:#eef3f9;color:#3b5b80;border-radius:4px;padding:1px 7px;font-size:11.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11.5px;border-radius:4px;padding:1px 7px;background:#f1f4f8;color:#5a6a80;border:1px solid #e6ebf2}
.tag.cat{background:#e8f0fa;color:#1b4f8f;border-color:#d3e2f4;font-weight:600}
.tag.track{background:#fff2f0;color:#b23b3b;border-color:#f3d6d2}
.card-side{flex:none;width:118px;text-align:right;display:flex;flex-direction:column;justify-content:center;gap:4px;border-left:1px dashed #e8edf4;padding-left:12px}
.pdate{font-size:15px;font-weight:700;color:#33415a;font-variant-numeric:tabular-nums}
.dl{font-size:12px;color:var(--muted)}
.dl.hot{color:var(--red);font-weight:700}
.budget{font-size:12.5px;color:#8a6100;background:#fff8e6;border-radius:4px;padding:1px 6px;align-self:flex-end}
.status{font-size:11.5px;color:var(--green)}
.status.closed{color:#8b96a6}
.empty{background:#fff;border:1px dashed #cfd8e4;border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted)}
.foot{max-width:1400px;margin:0 auto;padding:0 20px 30px;color:#8b96a6;font-size:11.5px;line-height:1.8}
.overlay{display:none;position:fixed;inset:0;background:rgba(10,20,35,.35);z-index:45}
.overlay.on{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2431;color:#fff;padding:8px 16px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.on{opacity:.95}

@media (max-width:980px){
  .layout{grid-template-columns:1fr;padding:12px 12px 50px}
  aside{display:none;position:fixed;left:0;top:0;bottom:0;width:280px;z-index:50;background:var(--bg);padding:12px;max-height:none;overflow:auto}
  aside.open{display:block}
  .menu-btn{display:inline-block}
  .stats{grid-template-columns:repeat(2,1fr)}
  .card-side{width:96px}
}
@media (max-width:520px){
  .brand h1{font-size:17px}
  .brand .sub{display:none}
  .top-right .upd{display:none}
  .stat .v{font-size:22px}
  .card{padding:12px;gap:8px}
  .card-side{width:82px;padding-left:8px}
  .pdate{font-size:13px}
  .budget{display:none}
}

/* iOS / macOS 视觉层 v2 */
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;letter-spacing:.1px}
.brand h1{font-weight:700;letter-spacing:-.4px}
.side-card,.stat,.toolbar,.card,.focus,.empty{border-radius:16px}
.card{box-shadow:var(--shadow);border-color:var(--line)}
.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);border-color:var(--line)}
.tabs{background:rgba(118,118,128,.12);padding:3px;border-radius:10px;gap:2px}
.tab{border:none;background:transparent;padding:5px 14px;color:var(--muted)}
.tab.active{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{border:1px solid var(--line);background:var(--card)}
.chip.active{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.search input{background:rgba(118,118,128,.10);border:none}
.search input:focus{background:var(--card);box-shadow:0 0 0 3px var(--blue-soft);border:none}
select{background:var(--card);border:1px solid var(--line);border-radius:9px}
.side-head{background:transparent;border-bottom:1px solid var(--line)}
.stat:before{display:none}
.stat{position:relative}
@media (prefers-color-scheme: dark){
  .topbar{background:rgba(0,0,0,.72);color:#f2f2f7}
  .tabs{background:rgba(118,118,128,.24)}
  .tab.active{background:#2c2c2e;color:#fff}
  .search input{background:rgba(118,118,128,.24);color:#fff}
  .search input:focus{background:#2c2c2e}
  .card-title{color:#f2f2f7}
  .org{color:#d1d1d6}
  .pill{background:rgba(118,118,128,.24);color:#d1d1d6}
  .tag{background:rgba(118,118,128,.20);color:#d1d1d6;border-color:transparent}
  .tag.cat{background:rgba(10,132,255,.22);color:#64a8ff;border-color:transparent}
  .pdate{color:#f2f2f7}
  .h-item{color:#d1d1d6}
  .side-head small{color:#8e8e93}
  .src-list a{color:#d1d1d6;border-bottom-color:rgba(84,84,88,.4)}
}

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <button class="menu-btn" id="menuBtn">☰ 筛选</button>
    <div class="brand">
      <div class="logo">🏥</div>
      <div>
        <h1>京津冀医院招标看板</h1>
        <div class="sub">北京优先 · 政府采购 + 军队采购 · 检验科细分</div>
      </div>
    </div>
    <div class="top-right">
      <span class="upd" id="upd">数据加载中…</span>
      <button class="btn-ghost" id="refreshBtn">刷新</button>
      <button class="btn-ghost" id="toggleFav">★ 我的关注</button>
    </div>
  </div>
</header>

<div class="overlay" id="overlay"></div>

<div class="layout">
  <aside id="sidebar">
    <div class="side-card">
      <div class="side-head">医院名录 <small>点击筛选</small></div>
      <div class="side-body" id="hospitals"></div>
    </div>
    <div class="side-card">
      <div class="side-head">数据源 <small>官方</small></div>
      <div class="src-list">
        <a href="http://www.ccgp-beijing.gov.cn/" target="_blank" rel="noopener">北京市政府采购网<span>北京</span></a>
        <a href="https://www.plap.mil.cn/" target="_blank" rel="noopener">军队采购网<span>北京</span></a>
        <a href="http://www.ccgp-tianjin.gov.cn/" target="_blank" rel="noopener">天津市政府采购网<span>天津</span></a>
        <a href="http://www.ccgp-hebei.gov.cn/" target="_blank" rel="noopener">河北省政府采购网<span>河北</span></a>
        <a href="http://www.ccgp.gov.cn/" target="_blank" rel="noopener">中国政府采购网<span>全国</span></a>
      </div>
    </div>
  </aside>

  <main>
    <section class="stats">
      <div class="stat s1"><div class="k">进行中</div><div class="v" id="st-active">-<small>条</small></div></div>
      <div class="stat s2"><div class="k">今日新增</div><div class="v" id="st-today">-<small>条</small></div></div>
      <div class="stat s3"><div class="k">3 日内截止</div><div class="v" id="st-soon">-<small>条</small></div></div>
      <div class="stat s4"><div class="k">重点关注</div><div class="v" id="st-focus">-<small>条</small></div></div>
    </section>

    <section class="focus" id="focusBox">
      <h3>🔴 重点关注 <span style="font-weight:400;color:#b06a66;font-size:12px">按关注品类自动收敛</span></h3>
      <ul id="focusList"></ul>
    </section>

    <section class="toolbar">
      <div class="row">
        <div class="tabs" id="regionTabs">
          <button class="tab active" data-region="北京">北京</button>
          <button class="tab" data-region="全部">全部</button>
          <button class="tab" data-region="天津">天津</button>
          <button class="tab" data-region="河北">河北</button>
        </div>
        <div class="spacer"></div>
        <div class="search"><input id="q" type="search" placeholder="搜项目 / 医院 / 城市，如：内窥镜、人民医院"></div>
        <select id="statusSel">
          <option value="进行中">进行中</option>
          <option value="全部">全部状态</option>
          <option value="已截止">已截止</option>
        </select>
        <select id="sourceSel">
          <option value="全部">全部来源</option>
          <option value="301医院招标采购网">301 医院</option>
          <option value="军队采购网">军队采购</option>
          <option value="北京市政府采购网">北京政府采购</option>
          <option value="中国政府采购网">中国政府采购网</option>
          <option value="天津市政府采购网">天津</option>
          <option value="河北省政府采购网">河北</option>
        </select>
        <select id="sortSel">
          <option value="date">按发布时间</option>
          <option value="deadline">按截止时间</option>
          <option value="budget">按预算</option>
        </select>
      </div>
      <div class="row">
        <div class="chips" id="chips"></div>
        <div class="chips" id="subchips" style="margin-top:-4px"></div>
      </div>
    </section>

    <section class="list" id="list"></section>
  </main>
</div>

<div class="foot">
  数据来自政府采购官方平台公开信息，仅供内部参考；项目详情、预算、截止时间以原公告为准。
  看板每 30 分钟自动更新一次（需保持采集任务运行）。
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CN_TZ = 'Asia/Shanghai';

let DATA = {items: [], updated_at: '', focus_categories: []};
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('jjkb_favs') || '[]')); } catch(e) {}

const state = {region:'北京', cat:'全部', subcat:'全部', status:'进行中', source:'全部', q:'', hospital:null, favOnly:false, sort:'date'};

function todayStr(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:CN_TZ, year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return `${g('year')}-${g('month')}-${g('day')}`;
}
function parseDT(s){
  if(!s) return null;
  const m = String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||23), +(m[5]||59));
}
function daysLeft(dl){
  const d = parseDT(dl); if(!d) return null;
  const ms = d - new Date();
  return Math.ceil(ms / 86400000);
}
function fmtMD(s){ const m = String(s||'').match(/-(\d{2})-(\d{2})/); return m ? `${m[1]}-${m[2]}` : (s||'').slice(5); }
function money(s){ return s ? s : ''; }
function isFocus(it){ return (DATA.focus_categories||[]).includes(it.category); }

function load(){
  fetch('data.json?t=' + Date.now(), {cache:'no-store'})
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      DATA = d;
      $('#upd').textContent = '数据更新于 ' + (d.updated_at ? d.updated_at.replace('T',' ').slice(0,16) : '未知');
      renderAll();
    })
    .catch(err => {
      $('#upd').textContent = '数据加载失败';
      $('#list').innerHTML = `<div class="empty">数据加载失败：${esc(err.message)}<br><br>如果页面一直加载失败，请检查 data.json 是否已上传到同一目录。</div>`;
    });
}

function renderAll(){
  renderStats(); renderFocus(); renderChips(); renderHospitals(); renderList();
}

function activeItems(){ return DATA.items.filter(x => x.status === '进行中'); }

function renderStats(){
  const items = DATA.items.filter(x => state.region === '全部' || x.region === state.region), today = todayStr();
  const act = items.filter(x => x.status === '进行中');
  const todayNew = items.filter(x => (x.publish_date||'').slice(0,10) === today);
  const soon = act.filter(x => { const d = daysLeft(x.deadline); return d !== null && d >= 0 && d <= 3; });
  const focus = act.filter(isFocus);
  $('#st-active').innerHTML = act.length + '<small>条</small>';
  $('#st-today').innerHTML = todayNew.length + '<small>条</small>';
  $('#st-soon').innerHTML = soon.length + '<small>条</small>';
  $('#st-focus').innerHTML = focus.length + '<small>条</small>';
}

function renderFocus(){
  const focus = activeItems().filter(isFocus)
    .sort((a,b) => (parseDT(a.deadline)?.getTime()||9e15) - (parseDT(b.deadline)?.getTime()||9e15))
    .slice(0,3);
  if(!focus.length){ $('#focusBox').classList.remove('on'); return; }
  $('#focusBox').classList.add('on');
  $('#focusList').innerHTML = focus.map(it => {
    const d = daysLeft(it.deadline);
    const tail = d === null ? '' : (d < 0 ? '（已截止）' : `（剩 ${d} 天）`);
    return `<li><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a> <span class="more">${esc(it.city)} · ${esc(it.purchaser||it.source)}${tail}</span></li>`;
  }).join('');
}

function countsByCat(){
  const m = new Map();
  DATA.items.filter(x => x.status === '进行中').forEach(x => m.set(x.category, (m.get(x.category)||0)+1));
  return [...m.entries()].sort((a,b) => b[1]-a[1]);
}

function renderChips(){
  const cs = countsByCat();
  const total = cs.reduce((s,x)=>s+x[1],0);
  let html = `<button class="chip ${state.cat==='全部'?'active':''}" data-cat="全部">全部 <span class="c">${total}</span></button>`;
  html += cs.map(([c,n]) => `<button class="chip ${state.cat===c?'active':''}" data-cat="${esc(c)}">${esc(c)} <span class="c">${n}</span></button>`).join('');
  $('#chips').innerHTML = html;
  $('#chips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
    state.cat = b.dataset.cat;
    state.subcat = '全部';
    renderChips(); renderList();
  });

  // 检验科二级细分
  const sub = $('#subchips');
  if(state.cat !== '检验科'){ sub.innerHTML = ''; return; }
  const m = new Map();
  DATA.items.filter(x => x.status==='进行中' && x.category==='检验科' && (state.region==='全部'||x.region===state.region))
    .forEach(x => { const k = x.subcat || '未细分'; m.set(k, (m.get(k)||0)+1); });
  const arr = [...m.entries()].sort((a,b)=>b[1]-a[1]);
  const st = arr.reduce((s,x)=>s+x[1],0);
  sub.innerHTML = `<button class="chip ${state.subcat==='全部'?'active':''}" data-sub="全部">全部细分 <span class="c">${st}</span></button>`
    + arr.map(([s,n]) => `<button class="chip ${state.subcat===s?'active':''}" data-sub="${esc(s)}">${esc(s)} <span class="c">${n}</span></button>`).join('');
  sub.querySelectorAll('.chip').forEach(b => b.onclick = () => { state.subcat = b.dataset.sub; renderChips(); renderList(); });
}

function renderHospitals(){
  const map = new Map();
  DATA.items.filter(x => x.status === '进行中' && x.purchaser).forEach(x => {
    const city = x.city || x.region || '其他';
    if(!map.has(city)) map.set(city, new Map());
    const cm = map.get(city);
    cm.set(x.purchaser, (cm.get(x.purchaser)||0)+1);
  });
  const order = ['北京','天津','石家庄','唐山','秦皇岛','邯郸','邢台','保定','张家口','承德','沧州','廊坊','衡水','雄安'];
  const cities = [...map.keys()].sort((a,b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  let html = '';
  if(state.hospital) html += `<button class="clear-filter" id="clearH">✕ 清除医院筛选：${esc(state.hospital)}</button>`;
  cities.forEach(city => {
    const cm = map.get(city);
    const arr = [...cm.entries()].sort((a,b)=>b[1]-a[1]);
    const sum = arr.reduce((s,x)=>s+x[1],0);
    html += `<details class="city" ${city==='北京'?'open':''}><summary><span>${esc(city)}</span><span class="n">${sum}</span></summary><div class="h-list">`;
    html += arr.map(([h,n]) => `<div class="h-item ${state.hospital===h?'active':''}" data-h="${esc(h)}"><span>${esc(h)}</span><span class="n">${n}</span></div>`).join('');
    html += `</div></details>`;
  });
  $('#hospitals').innerHTML = html || '<div style="padding:10px;color:#8b96a6;font-size:12px">暂无数据</div>';
  const ch = $('#clearH'); if(ch) ch.onclick = () => { state.hospital = null; renderHospitals(); renderList(); };
  $('#hospitals').querySelectorAll('.h-item').forEach(el => el.onclick = () => {
    state.hospital = (state.hospital === el.dataset.h) ? null : el.dataset.h;
    renderHospitals(); renderList(); closeSidebar();
  });
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  let arr = DATA.items.filter(x => {
    if(state.region !== '全部' && x.region !== state.region) return false;
    if(state.status !== '全部' && x.status !== state.status) return false;
    if(state.source !== '全部' && x.source !== state.source) return false;
    if(state.cat !== '全部' && x.category !== state.cat) return false;
    if(state.cat === '检验科' && state.subcat !== '全部' && (x.subcat || '未细分') !== state.subcat) return false;
    if(state.hospital && x.purchaser !== state.hospital) return false;
    if(state.favOnly && !favs.has(x.id)) return false;
    if(q){
      const hay = (x.title+' '+(x.purchaser||'')+' '+(x.city||'')+' '+(x.tags||[]).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(state.sort === 'deadline'){
    arr.sort((a,b) => (parseDT(a.deadline)?.getTime()||9e15) - (parseDT(b.deadline)?.getTime()||9e15));
  } else if(state.sort === 'date'){
    arr.sort((a,b) => String(b.publish_date).localeCompare(String(a.publish_date)));
  } else if(state.sort === 'budget'){
    arr.sort((a,b) => parseFloat(b.budget||0) - parseFloat(a.budget||0));
  }
  return arr;
}

function renderList(){
  const arr = filtered();
  if(!arr.length){
    $('#list').innerHTML = '<div class="empty">没有符合条件的招标信息<br><span style="font-size:12px">试试切换地区、品类，或把状态改为“全部”</span></div>';
    return;
  }
  $('#list').innerHTML = arr.map(it => {
    const d = daysLeft(it.deadline);
    const hot = d !== null && d >= 0 && d <= 3;
    const dl = it.deadline ? (d === null ? esc(it.deadline) : (d < 0 ? '已截止' : (d === 0 ? '今天截止' : `剩 ${d} 天`))) : (it.status === '进行中' ? '见原文' : '—');
    const tags = (it.tags||[]).slice(0,3).map(t => `<span class="tag ${t===it.category?'cat':''}">${esc(t)}</span>`).join('');
    const subTag = (it.category==='检验科' && it.subcat) ? `<span class="tag cat">${esc(it.subcat)}</span>` : '';
    const focused = isFocus(it) ? '<span class="tag track">重点关注</span>' : '';
    return `<article class="card" data-id="${esc(it.id)}">
      <div class="card-main">
        <div class="card-top">
          <span class="dot ${it.status==='已截止'?'closed':''}"></span>
          <a class="card-title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
          <button class="star ${favs.has(it.id)?'on':''}" data-fav="${esc(it.id)}" title="关注">★</button>
        </div>
        <div class="meta">
          <span class="pill">${esc(it.city || it.region)}</span>
          <span class="org">${esc(it.purchaser || '采购人见原文')}</span>
          <span>${esc(it.source)}</span>
        </div>
        <div class="tags">${subTag}${tags}${focused}</div>
      </div>
      <div class="card-side">
        <div class="pdate">${esc(fmtMD(it.publish_date))}</div>
        <div class="status ${it.status==='已截止'?'closed':''}">${it.status==='已截止'?'已截止':'进行中'}</div>
        <div class="dl ${hot?'hot':''}">${dl}</div>
        ${it.budget?`<div class="budget">${esc(it.budget)}</div>`:''}
      </div>
    </article>`;
  }).join('');
  $('#list').querySelectorAll('.star').forEach(b => b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    const id = b.dataset.fav;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    localStorage.setItem('jjkb_favs', JSON.stringify([...favs]));
    b.classList.toggle('on');
    if(state.favOnly) renderList();
    toast(favs.has(id) ? '已加入关注' : '已取消关注');
  });
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 1500);
}

function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('on'); }

/* 事件 */
$('#regionTabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
  state.region = b.dataset.region;
  $('#regionTabs').querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
  renderStats(); renderChips(); renderList();
});
$('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('#statusSel').onchange = e => { state.status = e.target.value; renderChips(); renderList(); };
$('#sourceSel').onchange = e => { state.source = e.target.value; renderList(); };
$('#sortSel').onchange = e => { state.sort = e.target.value; renderList(); };
$('#refreshBtn').onclick = load;
$('#toggleFav').onclick = () => {
  state.favOnly = !state.favOnly;
  $('#toggleFav').classList.toggle('active', state.favOnly);
  renderList();
};
$('#menuBtn').onclick = () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('on'); };
$('#overlay').onclick = closeSidebar;

load();
setInterval(() => { if(document.visibilityState === 'visible') load(); }, 5 * 60 * 1000);
</script>
</body>
</html>
