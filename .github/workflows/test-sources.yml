
name: test-sources
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check source connectivity
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          check() {
            name="$1"
            url="$2"
            out="/tmp/out.bin"
            code=$(curl -L -m 45 -A "$UA" -s -o "$out" -w "%{http_code}" "$url")
            size=$(wc -c < "$out" | tr -d ' ')
            echo "===== $name ====="
            echo "HTTP $code | $size bytes"
            head -c 260 "$out" | tr -d '\r' | tr '\n' ' '
            echo ""
          }
          check "301" "https://zbcg.301hospital.com.cn/Admin-Portal-proclamation-type-1.html"
          check "JUN" "https://www.plap.mil.cn/freecms-glht/rest/v1/notice/selectInfoMoreChannel.do?siteId=404bb030-5be9-4070-85bd-c94b1473e8de&channel=e0172398-23dd-47be-a092-14c67a92bd4f&currPage=1&pageSize=5&regionCode=110000"
          check "BEIJING" "http://www.ccgp-beijing.gov.cn/xxgg/sjxxgg/zbgg/A002004001001index_1.htm"
          check "HEBEI" "http://www.ccgp-hebei.gov.cn/province/cggg/zbgg/index.html"
          check "TIANJIN" "http://www.ccgp-tianjin.gov.cn/portal/topicView.do?method=view&view=Infor&id=1665&ver=2&st=1"
          check "CN" "http://www.ccgp.gov.cn/cggg/dfgg/gkzb/"
